name: "Milestone 2: First Repo"
description: "Confirm it: the checker reads your repo."
title: "Claim: Milestone 2: First Repo"
body:
  - type: markdown
    attributes:
      value: |
        Paste the link and submit. The checker runs straight away and comments here; when everything passes, the milestone is confirmed and the issue closes.

        **What's checked**

        - The repo is public and yours (or in an organisation you're a public member of), and not a fork.
        - It has no GUIDE.md and no solution/ folder.

        This issue is public: your GitHub username and your repo links are visible to anyone. Never put an email address here.
  - type: dropdown
    id: claim
    attributes:
      label: "What are you claiming?"
      options:
        - "Milestone 2: First Repo"
      default: 0
    validations:
      required: true
  - type: input
    id: repo_repo1
    attributes:
      label: "Your first public repo"
      description: "The link to its public GitHub repo."
      placeholder: "https://github.com/your-username/your-repo"
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: "Confirm"
      options:
        - label: "These repos are mine, and the work in them is my own"
          required: true
