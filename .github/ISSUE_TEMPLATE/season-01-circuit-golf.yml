name: "⛳ Season 1: Quantum Circuit Golf entry"
description: "Send your sealed Season 1 card and get your rank on the live board."
title: "⛳ Season 1 entry"
labels: ["season-01"]
body:
  - type: markdown
    attributes:
      value: |
        Make your card in the Season 1 pack, inside your venv: `python grade.py --card YOUR_GITHUB_USERNAME`. It scores your holes, then prints a sealed block that only the club's scoring workflow can open, so your circuits stay private and only your strokes go on the [live board](https://github.com/Ganamedee/qbc-certificates/blob/HEAD/seasons/boards/season-01.md).

        Paste the whole block below, BEGIN and END lines included, and send it. Your score and rank come back as a comment on this issue within minutes. Your best card counts: send a better one whenever you like, or edit this issue and paste it in.
  - type: textarea
    id: card
    attributes:
      label: "Your Season 1 card"
      description: "The whole block that `python grade.py --card YOUR_GITHUB_USERNAME` prints."
      placeholder: "-----BEGIN QBC SEALED CARD-----"
      render: text
    validations:
      required: true
