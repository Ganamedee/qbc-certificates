name: "Build Sprint Graduate"
description: "Claim it: the checker reads your sprint repo and when you pushed to it."
title: "Claim: Build Sprint Graduate"
body:
  - type: markdown
    attributes:
      value: |
        Your sprint is checked from your sprint repo's push history on GitHub, which records when each push arrived: when you pushed your goal, the weeks you pushed work, and your What I shipped section.
        Paste the link to each repo below and submit. The checker runs straight away and comments here within a few minutes (pathway builds take longer). If anything is missing it says exactly what; fix it, push, and comment `/recheck`. When everything passes, your certificate is issued automatically and its link lands in this issue.

        **What's checked**

        - The repo is public and yours (or in an organisation you're a public member of), not a fork, with a README.
        - **Your goal:** your first push with a Goal section in the README (at least 8 words) starts your sprint. That's week 0, and each week is 7 days from that push.
        - **Your weeks:** you pushed work to the repo (any branch) in at least 4 of the 6 weeks after week 0.
        - **Your ship:** by the end of week 6, you pushed a README with a What I shipped section of at least 30 words.
        - Only your own pushes count, at the times GitHub recorded them (the repo's Activity tab), so commit dates don't matter. A new sprint needs a new repo.

        This issue is public: your GitHub username, your repo links and the name you type are visible to anyone. Never put an email address here.
  - type: dropdown
    id: claim
    attributes:
      label: "What are you claiming?"
      options:
        - "Build Sprint Graduate"
      default: 0
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: "Your name, as it should appear on the certificate"
      description: "Printed on the certificate and shown on its page. Up to 100 characters."
      placeholder: "Ada Lovelace"
    validations:
      required: true
  - type: input
    id: repo_sprint
    attributes:
      label: "Your Build Sprint project"
      description: "The link to its public GitHub repo."
      placeholder: "https://github.com/your-username/your-repo"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: "Your certificate's page"
      description: "Your repos are listed on the certificate’s page unless you tick this."
      options:
        - label: "Don't list my repos on my certificate's page"
  - type: checkboxes
    id: confirm
    attributes:
      label: "Confirm"
      options:
        - label: "These repos are mine, and the work in them is my own"
          required: true
