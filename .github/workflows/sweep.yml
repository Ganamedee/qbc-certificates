# Every hour: tells members whose claims passed that their certificate is live (or why it isn't
# yet), from what the club site publishes, and closes the issue. Reads only public pages.
name: sweep

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sweep

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Tell members about their certificates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python qbc_check.py sweep
